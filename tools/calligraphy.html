<!doctype html>
<!-- Renders one word of راشد ورهف in Diwan Thuluth (macOS) at a fixed text origin, so all words share a baseline.
     make-calligraphy.sh calls it as calligraphy.html#<word> and tools/compose-calligraphy.py lays the words out. -->
<meta charset="utf-8">
<style>
  html, body { margin: 0; background: transparent; }
  span { position: absolute; left: 100px; top: 60px; font-family: 'Diwan Thuluth'; font-size: 120px; line-height: 1;
         color: #000; -webkit-text-stroke: .6px #000; white-space: nowrap; }
</style>
<span id="w"></span>
<script>document.getElementById('w').textContent = decodeURIComponent(location.hash.slice(1));</script>
