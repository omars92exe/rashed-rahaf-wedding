<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Pinyon+Script&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body { position: relative; background: #f7f2e8 url("backdrop.png") 0 0 / 1200px 630px; font-family: "Cormorant Garamond", serif; color: #5c6b45; }
  .side { position: absolute; left: 80px; top: 0; bottom: 0; width: 440px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  .calli { position: relative; width: 210px; aspect-ratio: 587 / 702; }
  .calli i { position: absolute; inset: 0; -webkit-mask: center / contain no-repeat; }
  .calli .names-ar { z-index: 1; background: #424e33; -webkit-mask-image: url("../../assets/calli-names.png"); }
  .calli .waw { background: #8f4656; -webkit-mask-image: url("../../assets/calli-waw.png"); }
  .rule { display: flex; align-items: center; gap: 12px; margin: 16px 0 12px; color: #8e9a74; }
  .rule i { width: 54px; height: 1px; background: currentColor; }
  .rule b { font-weight: 400; font-size: 11px; }
  .names { margin: 0; font-weight: 500; font-size: 25px; letter-spacing: .34em; text-transform: uppercase; color: #5c6b45; }
  .names em { font-family: "Pinyon Script", cursive; font-style: normal; letter-spacing: 0; text-transform: none; font-size: 36px; color: #8f4656; margin: 0 .12em 0 -.1em; }
  .date { margin: 14px 0 0; font-size: 17px; font-weight: 500; letter-spacing: .42em; color: #4c5240; }
  .place { margin: 10px 0 0; font-family: "Pinyon Script", cursive; font-size: 28px; color: #8f4656; }
  .place span { font-family: "Cormorant Garamond", serif; font-size: 15px; letter-spacing: .3em; text-transform: uppercase; color: #4c5240; display: block; margin-top: 2px; }

<div class="side">
  <div class="calli"><i class="names-ar"></i><i class="waw"></i></div>
  <div class="rule"><i></i><b>◇</b><i></i></div>
  <h1 class="names">Rashed <em>&amp;</em> Rahaf</h1>
